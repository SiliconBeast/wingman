name: scope

on:
  schedule:
    - cron: "23 */4 * * *"        # full scan: every 4 hours
    - cron: "*/30 * * * *"        # priority scan: every 30 minutes, priority companies only
    - cron: "0 15 * * 1"          # weekly digest: Monday, ~9am America/Edmonton (drifts an hour over DST)
  workflow_dispatch:
    inputs:
      notify:
        description: "Post to Discord"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: scope
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide what this run does
        id: which
        run: |
          case "${{ github.event.schedule }}" in
            "*/30 * * * *") echo "mode=priority" >> "$GITHUB_OUTPUT" ;;
            "0 15 * * 1")   echo "mode=digest"   >> "$GITHUB_OUTPUT" ;;
            *)              echo "mode=full"     >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Scan (full)
        if: steps.which.outputs.mode == 'full'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scope run ${{ (github.event_name == 'workflow_dispatch' && !inputs.notify) && '--no-notify' || '' }}

      - name: Scan (priority companies only)
        if: steps.which.outputs.mode == 'priority'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scope run --priority

      - name: Follow-up reminders
        if: steps.which.outputs.mode == 'full'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scope nudge

      - name: Weekly digest
        if: steps.which.outputs.mode == 'digest'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scope digest

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -q -m "scan: $(cat data/.summary 2>/dev/null || echo update)"
          for i in 1 2 3 4; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 5))
          done
          echo "Could not push after 4 tries"; exit 1

# Desktop simulation of the supervisor (host test only, not the judged target).
# Zephyr sockets map to Linux sockets: the "RT1170" listens on the host's :5005.
CONFIG_ETH_NATIVE_POSIX=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
# no hardware watchdog / IMU / crypto HAL on the host
CONFIG_WATCHDOG=n
CONFIG_SENSOR=n
CONFIG_I2C=n

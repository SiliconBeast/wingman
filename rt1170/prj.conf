# --- networking: static 192.168.10.2 on the 100 Mbit port (ENET, KSZ8081) ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
# don't stall boot waiting for a cable; the address is applied either way
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_SHELL=y
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64

# --- shell / logging ---
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y

# --- drivers ---
CONFIG_GPIO=y
CONFIG_CRC=y
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_I2C=y
CONFIG_SENSOR=y

# --- instrumentation ---
CONFIG_TIMING_FUNCTIONS=y
CONFIG_FPU=y
# decide, imu and shell threads all use floating point: save FP context on switch
CONFIG_FPU_SHARING=y

# --- stacks ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- PHYTEC manifest injects demo modules into every app; Wingman owns the
#     watchdog, LEDs and button itself, so switch them all off ---
CONFIG_APP_WATCHDOG=n
CONFIG_APP_HEARTBEAT=n
CONFIG_APP_BUTTON=n
CONFIG_APP_AUDIO_SELCALL=n
CONFIG_APP_DAC_SAWTOOTH=n
CONFIG_APP_LED_ROLLOVER=n
CONFIG_APP_LVGL_RANDOM_NUMBER=n
CONFIG_APP_LVGL_TESTCARD=n
CONFIG_APP_LVGL_WIDGETS=n
CONFIG_APP_UPTIME_COUNTER=n
CONFIG_APP_USB_DEVICE=n
